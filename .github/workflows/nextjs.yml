# Builds the Next.js portfolio as a static export and publishes it to GitHub Pages.
#
# Where the site lands depends on which repo owns the Pages site: the user site
# `PavanBollepalli.github.io` maps to the domain root, while a project repo like
# `Modern-Portfolio-main` maps to `/<repo>`. `actions/configure-pages` reports that
# prefix, and the build receives it as `NEXT_PUBLIC_BASE_PATH`, which is the one
# place `next.config.ts` reads it from.
#
# `static_site_generator: next` is deliberately NOT set here. That option rewrites
# `next.config.js` in place, but this project configures itself in `next.config.ts`,
# and Next.js resolves `next.config.js` ahead of the TypeScript file — so the
# injected file would silently shadow every setting in it, `trailingSlash` included.
#
# `NEXT_PUBLIC_SITE_URL` is what canonicals, the sitemap, the RSS feed and Open Graph
# tags point at, so it has to include the base path or every URL would be a 404.

name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        env:
          # "" for a user site served at the domain root, "/<repo>" for a project site.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx --no-install next build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
